# /etc/httpd/conf.d/postgresql.istanbul.conf
# Required modules: mod_proxy, mod_proxy_http, mod_ssl, mod_headers
# Enable: httpd -M | grep proxy  (should show proxy_module, proxy_http_module)

# ── HTTP → HTTPS ───────────────────────────────────────────────
<VirtualHost *:80>
    ServerName  postgresql.istanbul
    ServerAlias www.postgresql.istanbul
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── HTTPS ──────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName  postgresql.istanbul
    ServerAlias www.postgresql.istanbul

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/postgresql.istanbul/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/postgresql.istanbul/privkey.pem
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        HIGH:!aNULL:!MD5

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Static files served directly by Apache (faster than Gunicorn)
    Alias /static /var/www/postgresql.istanbul/django/staticfiles
    <Directory /var/www/postgresql.istanbul/django/staticfiles>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        Header set Cache-Control "max-age=2592000, public"
    </Directory>

    # Everything else → Gunicorn via Unix socket
    ProxyPreserveHost On
    ProxyPass        /static !
    ProxyPass        / unix:/run/pgistanbul.sock|http://localhost/
    ProxyPassReverse / unix:/run/pgistanbul.sock|http://localhost/

    # Pass real IP to Django
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}e"

    ErrorLog  /var/log/httpd/postgresql.istanbul.error.log
    CustomLog /var/log/httpd/postgresql.istanbul.access.log combined
</VirtualHost>
